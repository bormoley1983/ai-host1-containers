services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - /models/vllm:/root/.cache/huggingface

    environment:
      #NVIDIA_VISIBLE_DEVICES: all
      HF_HOME: /root/.cache/huggingface
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    ipc: host # CRITICAL: Prevents shared memory (shm) exhaustion in vLLM
    command:
      - quocbao747/Ornith-1.5-9B-AWQ-W4A16-g128
      - --served-model-name
      - ornith-1.5:9b-vllm
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.65"
      - --kv-cache-dtype
      - fp8
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "8192"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --reasoning-parser
      - qwen3

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

    networks:
      - llm-backends

networks:
  llm-backends:
    external: true
