services:
  swift15:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: swift15-256k
    ports:
      - "8080:8080"
    volumes:
      - /models/llamacpp:/models:ro
      - /models/llamacpp-templates/qwen-chat-template.jinja:/templates/qwen-chat-template.jinja:ro
      - /models/llamacpp-cache:/root/.cache/llama.cpp
    command:
      - -m
      - /models/Swift-1.5-Qwen3.8-27B-Uncensored-VAL-APEX-I-MiniPlus-V3.gguf
      - --port
      - "8080"
      - --alias
      - local-qwen3.8:27B-144K
      - --n-gpu-layers
      - all
      - --fit
      - "off"
      - --ctx-size
      - "225000"
      - --n-predict
      - "16384"
      - --parallel
      - "2"
      - --kv-unified
      - --kv-offload
      - --cont-batching
      - --threads
      - "10"
      - --batch-size
      - "512"
      - --ubatch-size
      - "256"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --jinja
      - --chat-template-file
      - /templates/qwen-chat-template.jinja
      - --reasoning
      - "off"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "2"
      - --spec-draft-p-min
      - "0.85"
      - --cache-prompt
      - --cache-ram
      - "8192"
      - --timeout
      - "1200"
      - --sse-ping-interval
      - "15"
      - --temp
      - "0.7"
      - --top-p
      - "0.8"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "1.5"
      - --repeat-penalty
      - "1.0"
      - --metrics
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
