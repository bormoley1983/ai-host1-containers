litellm_settings:
  drop_params: true

  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    db: os.environ/REDIS_DB_INDEX
    namespace: "litellm.response-cache"
    ttl: 3600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY


router_settings:
  num_retries: 2
  timeout: 1200
  cooldown_time: 30
  allowed_fails: 2
